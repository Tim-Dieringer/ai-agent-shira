# Tool configuration only. Shira is an application that is run from a checkout
# (`python shira.py`), not a package published to PyPI, so dependencies stay in
# requirements.txt and there is no [project] / build-system table.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["memory"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]